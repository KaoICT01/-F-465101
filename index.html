        };

            { id: 'rank', title: 'แรงค์การออม', icon: icons.rank },
            { id: 'aiChat', title: 'แชท AI การออม', icon: icons.aiChat },
            { id: 'notifications', title: 'การแจ้งเตือน', icon: icons.notifications },
            { id: 'settings', title: 'ตั้งค่า', icon: icons.settings }
        ];

        // Format Number with currency options
        function formatNumber(num) {
            if (num === null || num === undefined || isNaN(num)) num = 0;
            const decimals = state.numberFormat.decimals;
            let formatted = Number(num).toFixed(decimals);
            if (state.numberFormat.useThousandSep) {
                const parts = formatted.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                formatted = parts.join('.');
            }
            return formatted;
        }

        // Format Date string according to state settings
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            if (state.dateFormat === 'MM/DD/YYYY') {
                return `${month}/${day}/${year}`;
            }
            return `${day}/${month}/${year}`;
        }

        // Toast Notification Display Helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 text-white border-slate-700';
            if (type === 'success') bgClass = 'bg-emerald-600 text-white shadow-emerald-500/20';
            if (type === 'error') bgClass = 'bg-rose-600 text-white shadow-rose-500/20';
            if (type === 'warning') bgClass = 'bg-amber-600 text-white shadow-amber-500/20';

            toast.className = `pointer-events-auto flex items-center justify-between p-4 rounded-xl shadow-lg border text-sm transform transition-all duration-300 translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>${message}</span>
                </div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function isMaintenanceWindow() {
            if (state.maintenanceOverride) return false;
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            // Maintenance window: 23:30 - 23:59
            return hours === 23 && minutes >= 30;
        }

        function initRealtimeClock() {
            const clockEl = document.getElementById('live-datetime');
            const updateClock = () => {
                const now = new Date();
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear();
                const hrs = String(now.getHours()).padStart(2, '0');
                const mins = String(now.getMinutes()).padStart(2, '0');
                const secs = String(now.getSeconds()).padStart(2, '0');

                if (clockEl) {
                    clockEl.textContent = `${day}/${month}/${year} ${hrs}:${mins}:${secs}`;
                }
                updateMaintenanceStatusUI();
            };
            updateClock();
            setInterval(updateClock, 1000);
        }

        async function setupAuthAndSync() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth initialization fallback:", err);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.user = user;
                    state.userId = user.uid;
                    listenToFirestoreData();
                }
            });
        }

        // Firestore real-time listeners following MANDATORY RULE 1 (/artifacts/{appId}/public/data/...)
        function listenToFirestoreData() {
            if (!state.userId) return;

            // Load Local Backup or Initialize
            loadLocalState();

            // Setup Real-time listener for main public collection
            const publicColRef = collection(db, 'artifacts', appId, 'public', 'data', 'userState');
            
            // Listen to updates with error handling
            onSnapshot(publicColRef, (snapshot) => {
                snapshot.forEach(docSnap => {
                    if (docSnap.id === state.userId) {
                        const data = docSnap.data();
                        if (data) {
                            if (data.savings) state.savings = data.savings;
                            if (data.goals) state.goals = data.goals;
                            if (data.goalHistory) state.goalHistory = data.goalHistory;
                            if (data.notifications) state.notifications = data.notifications;
                            renderActiveTab();
                        }
                    }
                });
            }, (error) => {
                console.warn("Firestore sync error (using local state fallback):", error);
            });
        }

        // Persistent State Save (Sync to Firestore + Memory mirror)
        async function persistState() {
            saveLocalState();
            if (!state.userId || !auth.currentUser) return;

            try {
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'userState', state.userId);
                await setDoc(userDocRef, {
                    savings: state.savings,
                    goals: state.goals,
                    goalHistory: state.goalHistory,
                    notifications: state.notifications,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.error("Failed to sync state to Firestore:", e);
            }
        }

        function saveLocalState() {
            try {
                const dataToSave = {
                    savings: state.savings,
                    goals: state.goals,
                    goalHistory: state.goalHistory,
                    notifications: state.notifications,
                    theme: state.theme,
                    language: state.language,
                    dateFormat: state.dateFormat,
                    numberFormat: state.numberFormat,
                    securityPin: state.securityPin
                };
                // Fallback store in memory window object to ensure durability across live changes
                window.__SAVINGS_APP_CACHE__ = JSON.stringify(dataToSave);
            } catch (err) {
                console.error("Local save error:", err);
            }
        }

        function loadLocalState() {
            try {
                if (window.__SAVINGS_APP_CACHE__) {
                    const parsed = JSON.parse(window.__SAVINGS_APP_CACHE__);
                    if (parsed.savings) state.savings = parsed.savings;
                    if (parsed.goals) state.goals = parsed.goals;
                    if (parsed.goalHistory) state.goalHistory = parsed.goalHistory;
                    if (parsed.notifications) state.notifications = parsed.notifications;
                    if (parsed.theme) state.theme = parsed.theme;
                    if (parsed.language) state.language = parsed.language;
                    if (parsed.dateFormat) state.dateFormat = parsed.dateFormat;
                    if (parsed.numberFormat) state.numberFormat = parsed.numberFormat;
                    if (parsed.securityPin) state.securityPin = parsed.securityPin;
                }
            } catch (e) {
                console.warn("Could not load local cache");
            }
        }

        function applyTheme(themeName) {
            state.theme = themeName;
            const root = document.documentElement;
            if (themeName === 'dark') {
                root.classList.add('dark');
            } else if (themeName === 'light') {
                root.classList.remove('dark');
            } else {
                // System default
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
            }
            saveLocalState();
        }

        function calculateSavingRank() {
            const totalSaved = state.savings.reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
            const totalRecords = state.savings.length;
            const completedGoals = state.goalHistory.length;

            // Score formula
            const score = Math.floor((totalSaved / 100) + (totalRecords * 20) + (completedGoals * 100));

            let rank = {
                title: 'Bronze Saver',
                level: 1,
                color: 'from-amber-600 to-amber-700',
                badgeBg: 'bg-amber-500/10 text-amber-600 border-amber-500/30',
                minScore: 0,
                nextScore: 500
            };

            if (score >= 5000) {
                rank = { title: 'Meta Saver Elite', level: 6, color: 'from-cyan-500 via-blue-600 to-indigo-600', badgeBg: 'bg-cyan-500/10 text-cyan-500 border-cyan-500/30', minScore: 5000, nextScore: 10000 };
            } else if (score >= 2500) {
                rank = { title: 'Diamond Saver', level: 5, color: 'from-blue-500 to-cyan-400', badgeBg: 'bg-blue-500/10 text-blue-500 border-blue-500/30', minScore: 2500, nextScore: 5000 };
            } else if (score >= 1200) {
                rank = { title: 'Platinum Saver', level: 4, color: 'from-emerald-500 to-teal-600', badgeBg: 'bg-emerald-500/10 text-emerald-500 border-emerald-500/30', minScore: 1200, nextScore: 2500 };
            } else if (score >= 500) {
                rank = { title: 'Gold Saver', level: 3, color: 'from-yellow-400 to-amber-500', badgeBg: 'bg-yellow-500/10 text-yellow-600 border-yellow-500/30', minScore: 500, nextScore: 1200 };
            } else if (score >= 200) {
                rank = { title: 'Silver Saver', level: 2, color: 'from-slate-400 to-slate-600', badgeBg: 'bg-slate-400/10 text-slate-500 border-slate-400/30', minScore: 200, nextScore: 500 };
            }

            const progressPct = Math.min(100, Math.floor(((score - rank.minScore) / (rank.nextScore - rank.minScore)) * 100));

            return { score, rank, progressPct, totalSaved, totalRecords, completedGoals };
        }

        function filterHistoryTable() {
            const tbody = document.getElementById('history-table-body');

            if (!tbody) return;

            const filtered = state.savings.filter(item => {
                const matchCategory = item.category && item.category.toLowerCase().includes(query);
                const matchDetail = item.detail && item.detail.toLowerCase().includes(query);
                const matchNote = item.note && item.note.toLowerCase().includes(query);
                return matchCategory || matchDetail || matchNote || query === '';
            }).sort((a,b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">ไม่พบรายการออมเงิน</td></tr>`;
                return;

        function checkGoalCompletions() {
            let stateUpdated = false;
            const now = new Date().getTime();

            state.goals.forEach(goal => {
                const current = Number(goal.currentAmount) || 0;
                const target = Number(goal.targetAmount) || 1;
                const pct = (current / target) * 100;

                if (pct >= 100 && goal.status !== 'completed') {
                    goal.status = 'completed';
                    goal.completedAt = new Date().toISOString();
                    stateUpdated = true;

                    // Add Notification
                    state.notifications.unshift({
                        id: 'notif-' + Date.now(),
                        title: 'เป้าหมายสำเร็จแล้ว!',
                        message: `เป้าหมาย "${goal.name}" ออมครบ ${formatNumber(target)} บาท เรียบร้อยแล้ว`,
                        date: new Date().toISOString(),
                        read: false
                    });

                    showToast(`เป้าหมาย "${goal.name}" ครบ 100% แล้ว!`, 'success');

                    // Auto-move after 1 minute (60,000 ms)
                    setTimeout(() => {
                        window.moveCompletedGoalToHistory(goal.id);
                    }, 60000);
                }
            });

            if (stateUpdated) persistState();
        }

        window.moveCompletedGoalToHistory = function(goalId) {
            const index = state.goals.findIndex(g => g.id === goalId);
            if (index !== -1) {
                const completedGoal = state.goals.splice(index, 1)[0];
                const startDate = new Date(completedGoal.startDate || Date.now());
                const endDate = new Date(completedGoal.completedAt || Date.now());
                const diffTime = Math.abs(endDate - startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                state.goalHistory.unshift({
                    ...completedGoal,
                    daysTaken: diffDays
                });

                persistState();
                showToast(`ย้ายเป้าหมาย "${completedGoal.name}" ไปยังประวัติเป้าหมายแล้ว`, 'success');
                if (state.activeTab === 'goals' || state.activeTab === 'goalHistory') renderActiveTab();
            }
        };

        function initAnalyticsCharts() {
            const trendCtx = document.getElementById('savingsTrendChart')?.getContext('2d');

            if (trendCtx) {
                // Group by dates

                state.savings.forEach(item => {
                    dateMap[item.date] = (dateMap[item.date] || 0) + Number(item.amount);

                const data = labels.map(l => dateMap[l]);

                    type: 'line',

                    options: { responsive: true, maintainAspectRatio: false }

                            </button>
                            <button onclick="window.triggerAIAnalysis('goalRisk')" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-700 dark:text-slate-200 text-xs font-medium transition border border-slate-200 dark:border-slate-600">
                                ประเมินเป้าหมายการออม
                            </button>
                            <button onclick="window.triggerAIAnalysis('rankEval')" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-700 dark:text-slate-200 text-xs font-medium transition border border-slate-200 dark:border-slate-600">
                                ประเมินระดับแรงค์และโบนัส
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.triggerAIAnalysis = function(topic) {
            const totalSaved = state.savings.reduce((acc, c) => acc + Number(c.amount), 0);
            const count = state.savings.length;
            const activeGoals = state.goals.length;

            let userQuery = '';
            let aiResponse = '';

            if (topic === 'trend') {
                userQuery = 'วิเคราะห์แนวโน้มการออม';
                aiResponse = `จากการวิเคราะห์ข้อมูลการออมทั้งหมด ${count} รายการ ยอดสะสมรวม ${formatNumber(totalSaved)} บาท:\n\n1. คุณมีการออมเฉลี่ยต่อรายการอยู่ที่ ${formatNumber(count ? totalSaved / count : 0)} บาท\n2. วินัยการออมของคุณอยู่ในเกณฑ์ดี แนะนำให้ออมสม่ำเสมอทุกสัปดาห์`;
            } else if (topic === 'tips') {
                userQuery = 'คำแนะนำการประหยัดเดือนนี้';
                aiResponse = `เทคนิคการออมสำหรับเดือนนี้:\n• ลองใช้วิธี "หักออมก่อนใช้" 10% ของรายได้ทันทีที่รับเงิน\n• หากมีเงินทอนเหรียญ นำมาบันทึกในหมวด "เงินเหลือประจำวัน" เพื่อสะสมเล็กผสมน้อย`;
            } else if (topic === 'goalRisk') {
                userQuery = 'ประเมินเป้าหมายการออม';
                aiResponse = `ขณะนี้คุณมีเป้าหมายที่กำลังทำอยู่ ${activeGoals} เป้าหมาย\nเป้าหมายทั้งหมดทำงานแยกอิสระจากยอดออมหลัก พยายามเติมยอดให้ครบเพื่อให้ระบบย้ายเข้าประวัติเป้าหมายโดยสมบูรณ์!`;
            } else {
                userQuery = 'ประเมินระดับแรงค์และโบนัส';
                const { score, rank } = calculateSavingRank();
                aiResponse = `ระดับแรงค์ปัจจุบันของคุณคือ: **${rank.title}** (คะแนน ${score} แต้ม)\nบันทึกรายการเพิ่มขึ้นเพื่ออัพเกรดสู่ระดับถัดไป!`;
            }

            state.chatMessages.push({ sender: 'user', text: userQuery });
            state.chatMessages.push({ sender: 'ai', text: aiResponse });

            renderActiveTab();
            setTimeout(() => {
                const chatContainer = document.getElementById('chat-messages');
                if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        };

        function renderNotificationsView() {
            return `
                <div class="glass-panel p-6 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-700/60 space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
                        <div>
                            <h3 class="font-bold text-base text-slate-900 dark:text-white">การแจ้งเตือนระบบ</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400">ประวัติการแจ้งเตือนกิจกรรมและการออม</p>
                        </div>
                        <button onclick="window.clearAllNotifications()" class="text-xs text-rose-500 hover:underline">ล้างทั้งหมด</button>
                    </div>

                    ${state.notifications.length === 0 ? `
                        <div class="py-12 text-center text-slate-400 text-xs">ไม่มีการแจ้งเตือนใหม่</div>
                    ` : `
                        <div class="space-y-2">
                            ${state.notifications.map(n => `
                                <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 space-y-1">
                                    <h4 class="font-bold text-xs text-slate-800 dark:text-slate-200">${n.title}</h4>
                                    <p class="text-xs text-slate-600 dark:text-slate-400">${n.message}</p>
                                    <span class="text-[10px] text-slate-400">${formatDate(n.date)}</span>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        window.clearAllNotifications = function() {
            state.notifications = [];
            persistState();
            renderActiveTab();
            showToast('ล้างรายการแจ้งเตือนทั้งหมดแล้ว', 'success');
        };

        function renderSettingsView() {
            return `
                <div class="max-w-2xl mx-auto glass-panel p-6 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-700/60 space-y-6">
                    <div class="pb-3 border-b border-slate-200 dark:border-slate-700">
                        <h3 class="font-bold text-base text-slate-900 dark:text-white">ตั้งค่าระบบ</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400">ปรับแต่งการแสดงผลและรูปแบบของแอปพลิเคชัน</p>
                    </div>

                    <!-- Theme Setting -->
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">ธีมระบบ (Theme)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="window.setThemeConfig('light')" class="py-2 rounded-xl border ${state.theme === 'light' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'} text-xs font-medium transition">Light</button>
                            <button onclick="window.setThemeConfig('dark')" class="py-2 rounded-xl border ${state.theme === 'dark' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'} text-xs font-medium transition">Dark</button>
                            <button onclick="window.setThemeConfig('system')" class="py-2 rounded-xl border ${state.theme === 'system' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'} text-xs font-medium transition">System</button>
                        </div>
                    </div>

                    <!-- Date Format Setting -->
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">รูปแบบวันที่</label>
                        <select onchange="window.setDateFormatConfig(this.value)" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs">
                            <option value="DD/MM/YYYY" ${state.dateFormat === 'DD/MM/YYYY' ? 'selected' : ''}>DD/MM/YYYY (เช่น 31/12/2026)</option>
                            <option value="MM/DD/YYYY" ${state.dateFormat === 'MM/DD/YYYY' ? 'selected' : ''}>MM/DD/YYYY (เช่น 12/31/2026)</option>
                        </select>
                    </div>

                    <!-- App Info -->
                    <div class="pt-4 border-t border-slate-200 dark:border-slate-700 space-y-1 text-xs text-slate-500">
                        <p class="font-bold text-slate-800 dark:text-slate-200">ระบบบันทึกการออมมาตรฐาน v60.0.0</p>
                        <p>Meta Design Language 2026 Standard</p>
                        <p>ลิขสิทธิ์ระบบบันทึกการออมปลอดภัย ไร้ปุ่ม Backup/Restore (Auto Save Real-time)</p>
                    </div>
                </div>
            `;
        }

        window.setThemeConfig = function(t) {
            applyTheme(t);
            renderActiveTab();
            showToast(`เปลี่ยนธีมเป็น ${t} แล้ว`, 'success');
        };

        window.setDateFormatConfig = function(fmt) {
            state.dateFormat = fmt;
            saveLocalState();
            renderActiveTab();
            showToast('อัปเดตรูปแบบวันที่แล้ว', 'success');
        };

        function renderActiveTab() {
            const container = document.getElementById('view-container');
            if (!container) return;

            checkGoalCompletions();

            switch (state.activeTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    break;
                case 'record':
                    container.innerHTML = renderRecordView();
                    setupRecordFormEvents();
                    break;
                case 'history':
                    container.innerHTML = renderHistoryView();
                    filterHistoryTable();
                    document.getElementById('history-search')?.addEventListener('input', filterHistoryTable);
                    break;
                case 'goals':
                    container.innerHTML = renderGoalsView();
                    break;
                case 'goalHistory':
                    container.innerHTML = renderGoalHistoryView();
                    break;
                case 'analytics':
                    container.innerHTML = renderAnalyticsView();
                    break;
                case 'calendar':
                    container.innerHTML = renderCalendarView();
                    break;
                case 'rank':
                    container.innerHTML = renderRankView();
                    break;
                case 'aiChat':
                    container.innerHTML = renderAIChatView();
                    break;
                case 'notifications':
                    container.innerHTML = renderNotificationsView();
                    break;
                case 'settings':
                    container.innerHTML = renderSettingsView();
                    break;
                default:
                    container.innerHTML = renderDashboard();
            }
        }

        function setupRecordFormEvents() {
            const form = document.getElementById('record-form');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (isMaintenanceWindow()) {
                    showToast('ระบบปิดรับบันทึกช่วงเวลา 23:30 - 00:00 น.', 'warning');
                    return;
                }

                const date = document.getElementById('record-date').value;
                const amount = parseFloat(document.getElementById('record-amount').value);
                const category = document.getElementById('record-category').value;
                const detail = document.getElementById('record-detail').value;
                const note = document.getElementById('record-note').value;

                if (!amount || amount <= 0) {
                    showToast('กรุณากรอกจำนวนเงินให้ถูกต้อง', 'error');
                    return;
                }

                const newRecord = {
                    id: 'rec-' + Date.now(),
                    date,
                    amount,
                    category,
                    detail,
                    note,
                    createdAt: new Date().toISOString()
                };

                state.savings.unshift(newRecord);
                await persistState();

                showToast('บันทึกการออมเรียบร้อยแล้ว', 'success');
                window.switchTab('dashboard');
            });
        }

        // Delete record confirmation modal
        window.deleteSavingRecord = function(id) {
            openModal('ยืนยันการลบรายการ', 'คุณต้องการลบรายการออมนี้ใช่หรือไม่? ยอดรวมจะถูกปรับคำนวณใหม่ทันที', async () => {
                state.savings = state.savings.filter(s => s.id !== id);
                await persistState();
                showToast('ลบรายการเรียบร้อยแล้ว', 'success');
                renderActiveTab();
            });
        };

        // Open Modal Helper
        function openModal(title, bodyHtml, onConfirm) {
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const contentEl = document.getElementById('modal-content');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            if (!backdrop || !box) return;

            titleEl.textContent = title;
            contentEl.innerHTML = bodyHtml;

            backdrop.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);

            const close = () => {
                box.classList.remove('scale-100', 'opacity-100');
                box.classList.add('scale-95', 'opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 200);
            };

            document.getElementById('modal-close-btn').onclick = close;
            document.getElementById('modal-cancel-btn').onclick = close;

            confirmBtn.onclick = async () => {
                if (onConfirm) await onConfirm();
                close();
            };
        }

        window.openCreateGoalModal = function() {
            const formHtml = `
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">ชื่อเป้าหมาย</label>
                        <input type="text" id="goal-name" placeholder="เช่น ซื้อโน้ตบุ๊กใหม่" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">จำนวนเงินเป้าหมาย (บาท)</label>
                        <input type="number" id="goal-target" placeholder="0.00" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs">
                    </div>
                </div>
            `;

            openModal('สร้างเป้าหมายการออมใหม่', formHtml, async () => {
                const name = document.getElementById('goal-name').value;
                const target = parseFloat(document.getElementById('goal-target').value);

                if (!name || !target || target <= 0) {
                    showToast('กรุณากรอกข้อมูลเป้าหมายให้ครบถ้วน', 'error');
                    return;
                }

                const newGoal = {
                    id: 'goal-' + Date.now(),
                    name,
                    targetAmount: target,
                    currentAmount: 0,
                    startDate: new Date().toISOString().split('T')[0],
                    status: 'active'
                };

                state.goals.push(newGoal);
                await persistState();
                showToast('สร้างเป้าหมายการออมเรียบร้อยแล้ว', 'success');
                renderActiveTab();
            });
        };

        window.addMoneyToGoal = function(goalId) {
            const goal = state.goals.find(g => g.id === goalId);
            if (!goal) return;

            const formHtml = `
                <div class="space-y-3">
                    <p class="text-xs text-slate-500">ออมเข้าเป้าหมาย: <span class="font-bold text-slate-800 dark:text-slate-200">${goal.name}</span></p>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">จำนวนเงิน (บาท)</label>
                        <input type="number" id="goal-add-amount" placeholder="0.00" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs">
                    </div>
                </div>
            `;

            openModal('เพิ่มเงินเข้าเป้าหมาย', formHtml, async () => {
                const amt = parseFloat(document.getElementById('goal-add-amount').value);
                if (!amt || amt <= 0) {
                    showToast('กรุณากรอกจำนวนเงินให้ถูกต้อง', 'error');
                    return;
                }

                goal.currentAmount = (Number(goal.currentAmount) || 0) + amt;
                await persistState();
                showToast('เพิ่มเงินเข้าเป้าหมายเรียบร้อยแล้ว', 'success');
                renderActiveTab();
            });
        };

        function attachHeaderButtons() {
            // Button 1: Refresh Data (Re-sync local & Firestore state)
            document.getElementById('btn-refresh-data')?.addEventListener('click', () => {
                loadLocalState();
                renderActiveTab();
                showToast('ซิงก์และรีเฟรชข้อมูลเรียบร้อยแล้ว', 'success');
            });

            // Button 2: Refresh Screen (F5 reload)
            document.getElementById('btn-refresh-screen')?.addEventListener('click', () => {
                window.location.reload();
            });

            // Maintenance Override Test Toggle
            document.getElementById('btn-toggle-maintenance-override')?.addEventListener('click', () => {
                state.maintenanceOverride = !state.maintenanceOverride;
                updateMaintenanceStatusUI();
                renderActiveTab();
                showToast(state.maintenanceOverride ? 'ปลดล็อกโหมดทดสอบแล้ว' : 'เปิดใช้งานเวลาปิดปรับปรุงระบบ', 'warning');
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalState();
            applyTheme(state.theme);
            initRealtimeClock();
            renderNavigation();
            renderActiveTab();
            attachHeaderButtons();
            setupAuthAndSync();
        });
    </script>
</body>
</html>
